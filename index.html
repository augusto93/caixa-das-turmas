<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caixa das Turmas</title>
<meta name="theme-color" content="#2446c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caixa Turmas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app shell — sticky header, one centered column (max 760px), tab bar fixed to the bottom, forms in a bottom sheet */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --surface-2:#e8ecf5; --line:#d6dceb;
  --ink:#152039; --muted:#5b6682; --accent:#2446c7; --accent-ink:#ffffff; --accent-soft:#e1e7fc;
  --ok:#157647; --ok-soft:#d9f1e3; --warn:#9a5800; --warn-soft:#faebd0; --bad:#b3242d; --bad-soft:#fbe0e1;
  --shadow:0 10px 30px rgba(21,32,57,.14);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1322; --surface:#151d31; --surface-2:#1d2740; --line:#2a3552;
  --ink:#e6ebf7; --muted:#99a4c1; --accent:#8aa2ff; --accent-ink:#0b1022; --accent-soft:#222e56;
  --ok:#55cf8f; --ok-soft:#163828; --warn:#f0b24f; --warn-soft:#3a2c13; --bad:#ff7d86; --bad-soft:#40191d;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0d1322; --surface:#151d31; --surface-2:#1d2740; --line:#2a3552;
  --ink:#e6ebf7; --muted:#99a4c1; --accent:#8aa2ff; --accent-ink:#0b1022; --accent-soft:#222e56;
  --ok:#55cf8f; --ok-soft:#163828; --warn:#f0b24f; --warn-soft:#3a2c13; --bad:#ff7d86; --bad-soft:#40191d;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark }

*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.65rem}
h2{font-size:1.1rem}
h3{font-size:1.25rem}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.85rem}
.sync{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)}

main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.84rem}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.block{width:100%;justify-content:center;padding:12px}
.btn:disabled{opacity:.55;cursor:default}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--accent)}
.row .grow{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.row .name{font-weight:600;overflow-wrap:anywhere}
.chev{color:var(--muted);font-size:1.2rem}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok > i{background:var(--ok)}

.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.76rem;font-weight:600;border-radius:99px;padding:3px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.topic:hover{border-color:var(--accent)}
.topic b{font-family:var(--f-display);font-size:1.05rem}

.back{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;align-self:flex-start}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px}

.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:1.05rem}

.saldo{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px}
.saldo .big{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1}
.saldo .split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.saldo .split div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column}
.saldo .lbl{font-size:.78rem;opacity:.85;text-transform:uppercase;letter-spacing:.06em}
.saldo .v{font-weight:700;font-size:1.1rem}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:620px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:1.3rem;overflow-wrap:anywhere}
.tile .v.ok{color:var(--ok)} .tile .v.warn{color:var(--warn)}

.est{display:flex;flex-direction:column;gap:12px}
.est-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:flex;flex-direction:column;min-width:0}
.trio .v{font-weight:700}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:.9rem}
.pend{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pend div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.pend div:last-child{border-bottom:0}

.cat{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;font-size:.9rem}
.line-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line-item:last-child{border-bottom:0}
.line-item .grow{flex:1;min-width:0}
.line-item .grow > div:first-child{font-weight:600;overflow-wrap:anywhere}
.neg{color:var(--bad);font-weight:700;white-space:nowrap}
.pos{color:var(--ok);font-weight:700;white-space:nowrap}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.8rem;padding:4px 6px;border-radius:8px;white-space:nowrap}
.x.armed{background:var(--bad-soft);color:var(--bad);font-weight:600}

select.filter{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;max-width:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,15,30,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:20px;padding-bottom:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.close{background:var(--surface-2);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer;flex:none;font-size:1rem}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:.88rem}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:400;font-size:16px;width:100%}
label.f textarea{min-height:110px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-direction:column;gap:6px}
.check{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:500}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:.84rem;cursor:pointer}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;font-size:.9rem;max-width:calc(100% - 32px)}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
.userbox{display:flex;align-items:center;gap:10px}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.login h1{font-size:2rem}
.foot{display:flex;justify-content:center;padding-top:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><span class="brand-mark">R$</span>Caixa das Turmas</div>
  <div class="userbox"><div class="sync" id="sync"><span class="dot"></span>Conectando…</div><button class="btn sm" id="sair" data-act="sair" hidden>Sair</button></div>
</div></header>

<main id="main"><div class="loading">Carregando dados…</div></main>

<nav class="tabs" id="tabs" aria-label="Telas" hidden><div class="in">
  <button data-act="tab" data-tab="turmas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.2 2.8-5 5.5-5s4.9 1.8 5.5 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4-.2 4 1.3 4.5 4.3"/></svg>Turmas</button>
  <button data-act="tab" data-tab="saldo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M15.5 14.5h2.5"/><path d="M7 6V4.5h10V6"/></svg>Saldo</button>
  <button data-act="tab" data-tab="est"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V5"/><path d="M16 20v-7"/><path d="M21 20H3"/></svg>Estimativas</button>
</div></nav>

<div id="sheet-root"></div>

<script type="module">
import { firebaseConfig } from './firebase-config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
(function(){
const COLS=['turmas','topicos','alunos','pagamentos','despesas'];
const S={turmas:[],topicos:[],alunos:[],pagamentos:[],despesas:[]};
const CATS=['Frete','Enfeites','Alimentação','Local / Aluguel','Transporte','Fotos / Vídeo','Camisetas','Outros'];
const FORMAS=['Pix','Dinheiro','Cartão','Transferência'];
let fs=null, auth=null, me=null, mode='loading', ro=false, erroAcesso=false, unsubs=[];
const ui={tab:'turmas',turma:null,filtro:'',filtroTop:'',busca:'',open:{},sheet:null};
try{const s=JSON.parse(localStorage.getItem('caixa-ui')||'{}');if(s.tab)ui.tab=s.tab;if(s.filtro)ui.filtro=s.filtro;}catch(e){}
function saveUi(){try{localStorage.setItem('caixa-ui',JSON.stringify({tab:ui.tab,filtro:ui.filtro}))}catch(e){}}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fdata=s=>{if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y};
function parseBRL(s){s=String(s||'').replace(/R\$|\s/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*100)/100:NaN}
function dias(prazo){if(!prazo)return null;const [y,m,d]=prazo.split('-').map(Number);const a=new Date(y,m-1,d),t=new Date();t.setHours(0,0,0,0);return Math.round((a-t)/86400000)}
const byNome=(a,b)=>(a.nome||'').localeCompare(b.nome||'','pt-BR');
const pct=(a,b)=>b>0?Math.min(100,Math.round(a/b*100)):0;
let toastT;function toast(m){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------- data layer (Firebase Firestore) ----------
   Writes are not awaited: Firestore applies them to the local cache at once
   (the screen updates immediately, even offline) and syncs when online. */
function clean(o){const r={...o};delete r.id;return r}
function falhaEscrita(e){
  console.error(e);
  if(e&&e.code==='permission-denied')toast('Sua conta não tem permissão para alterar os dados.');
  else toast('Não foi possível salvar. Verifique a conexão.');
}
async function put(col,id,data){
  const body={...clean(data),atualizadoEm:Date.now(),por:me?.email||''};
  setDoc(doc(fs,col,id),body).catch(falhaEscrita);
}
async function del(col,id){
  deleteDoc(doc(fs,col,id)).catch(falhaEscrita);
}
async function run(fn,ok){
  try{await fn();if(ok)toast(ok)}
  catch(e){falhaEscrita(e);render()}
}
function assinar(){
  unsubs.forEach(u=>u());unsubs=[];
  const vistos=new Set();
  COLS.forEach(c=>{
    unsubs.push(onSnapshot(collection(fs,c),{includeMetadataChanges:false},snap=>{
      S[c]=snap.docs.map(x=>({id:x.id,...x.data()}));
      vistos.add(c);
      if(vistos.size===COLS.length&&mode==='loading')mode='sync';
      scheduleRender();
    },err=>{
      console.error(err);
      if(err.code==='permission-denied'){erroAcesso=true;mode='negado';render()}
      else toast('A sincronização parou. Recarregue a página.');
    }));
  });
}
function backup(){
  const blob=new Blob([JSON.stringify({exportadoEm:new Date().toISOString(),...S},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='caixa-das-turmas-backup-'+hoje()+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}

/* ---------- calculations ---------- */
const turma=id=>S.turmas.find(t=>t.id===id);
const topico=id=>S.topicos.find(t=>t.id===id);
const aluno=id=>S.alunos.find(a=>a.id===id);
const topicosDe=tid=>S.topicos.filter(t=>t.turmaId===tid).sort((a,b)=>(a.prazo||'9').localeCompare(b.prazo||'9')||byNome(a,b));
const alunosDe=tid=>S.alunos.filter(a=>a.turmaId===tid).sort(byNome);
function pago(alunoId,topId){let s=0;for(const p of S.pagamentos)if(p.alunoId===alunoId&&p.topicoId===topId)s+=Number(p.valor)||0;return Math.round(s*100)/100}
function statsTop(t){
  const al=S.alunos.filter(a=>a.turmaId===t.turmaId&&(a.topicos||[]).includes(t.id));
  const teto=Number(t.teto)||0;let arrec=0,falta=0,quit=0,zero=0;const pend=[];
  for(const a of al){const p=pago(a.id,t.id);arrec+=p;const f=Math.max(0,teto-p);falta+=f;if(f<=0.004)quit++;else pend.push({a,p,f});if(p===0)zero++}
  arrec=0;for(const p of S.pagamentos)if(p.topicoId===t.id)arrec+=Number(p.valor)||0;
  pend.sort((x,y)=>y.f-x.f);
  return {n:al.length,teto,meta:al.length*teto,arrec,falta,quit,zero,pend};
}
function statsTurma(tid){
  let meta=0,arrec=0,falta=0;for(const t of topicosDe(tid)){const s=statsTop(t);meta+=s.meta;falta+=s.falta}
  for(const p of S.pagamentos)if(p.turmaId===tid)arrec+=Number(p.valor)||0;
  return {meta,arrec,falta};
}
function alunoQuitado(a){const ts=a.topicos||[];if(!ts.length)return false;return ts.every(id=>{const t=topico(id);return !t||pago(a.id,id)>=(Number(t.teto)||0)-0.004})}
function prazoPill(prazo){const d=dias(prazo);if(d===null)return '<span class="pill">Sem prazo</span>';
  if(d<0)return `<span class="pill bad">Venceu há ${-d} dia${d===-1?'':'s'}</span>`;
  if(d===0)return '<span class="pill bad">Vence hoje</span>';
  return `<span class="pill ${d<=30?'warn':'acc'}">Faltam ${d} dia${d===1?'':'s'}</span>`}

/* ---------- render ---------- */
let raf=0;function scheduleRender(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
function render(){
  const sync=$('#sync');
  const online=navigator.onLine;
  sync.innerHTML=mode==='sync'?(online?'<span class="dot on"></span>Sincronizado':'<span class="dot"></span>Offline · salva ao reconectar'):mode==='login'||mode==='negado'?'':'<span class="dot"></span>Conectando…';
  $('#sair').hidden=!me;
  $('#tabs').hidden=mode!=='sync';
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===ui.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  const m=$('#main');
  if(mode==='config'){m.innerHTML=`<div class="login"><h1>Falta configurar</h1><p class="muted">Preencha o arquivo <b>firebase-config.js</b> com os dados do seu projeto Firebase (veja o README).</p></div>`;return}
  if(mode==='login'){m.innerHTML=`<div class="login"><div class="brand-mark" style="width:56px;height:56px;font-size:1.3rem;border-radius:16px">R$</div><h1>Caixa das Turmas</h1><p class="muted">Controle de pagamentos por turma, saldo e estimativas. Entre com sua conta Google para acessar.</p><button class="btn primary block" data-act="entrar">Entrar com Google</button></div>`;return}
  if(mode==='negado'){m.innerHTML=`<div class="login"><h1>Acesso não liberado</h1><p class="muted">A conta <b>${esc(me?.email||'')}</b> não tem permissão. Peça ao administrador para incluir este e-mail na lista de acesso do Firebase.</p><button class="btn block" data-act="sair">Entrar com outra conta</button></div>`;return}
  if(mode==='loading'){m.innerHTML='<div class="loading">Carregando dados…</div>';return}
  if(ui.filtro&&!turma(ui.filtro))ui.filtro='';
  if(ui.filtroTop&&!topico(ui.filtroTop))ui.filtroTop='';
  m.innerHTML=ui.tab==='saldo'?vSaldo():ui.tab==='est'?vEst():vTurmas();
  renderSheet(false);
}

function filtroSelect(withTop){
  let h=`<div class="filters"><select class="filter" id="f-turma" aria-label="Filtrar turma"><option value="">Todas as turmas</option>${S.turmas.slice().sort(byNome).map(t=>`<option value="${t.id}" ${t.id===ui.filtro?'selected':''}>${esc(t.nome)}</option>`).join('')}</select>`;
  if(withTop&&ui.filtro){h+=`<select class="filter" id="f-top" aria-label="Filtrar tópico"><option value="">Todos os tópicos</option>${topicosDe(ui.filtro).map(t=>`<option value="${t.id}" ${t.id===ui.filtroTop?'selected':''}>${esc(t.nome)}</option>`).join('')}</select>`}
  return h+'</div>';
}

/* Turmas */
function vTurmas(){
  if(ui.turma&&turma(ui.turma))return vTurma(turma(ui.turma));
  ui.turma=null;
  const ts=S.turmas.slice().sort(byNome);
  let h=`<div class="pagehead"><div><div class="eyebrow">Cadastro</div><h1>Turmas</h1></div>${ro?'':'<button class="btn primary" data-act="nova-turma">+ Nova turma</button>'}</div>`;
  if(!ts.length)return h+`<div class="empty"><strong>Nenhuma turma cadastrada</strong><span>Crie uma turma, depois adicione os tópicos (como Sítio e Formatura) com o valor total de cada um e cadastre os alunos.</span>${ro?'':'<button class="btn primary" data-act="nova-turma">Criar primeira turma</button>'}</div>`;
  h+='<div class="list">';
  for(const t of ts){const s=statsTurma(t.id);const na=alunosDe(t.id).length,nt=topicosDe(t.id).length;
    h+=`<button class="row" data-act="abrir-turma" data-id="${t.id}"><div class="grow"><div class="name">${esc(t.nome)}</div><div class="small muted">${na} aluno${na===1?'':'s'} · ${nt} tópico${nt===1?'':'s'}</div><div class="bar ${s.meta&&s.falta<=0?'ok':''}"><i style="width:${pct(s.arrec,s.meta)}%"></i></div><div class="small num"><b>${brl(s.arrec)}</b> <span class="muted">de ${brl(s.meta)}</span></div></div><span class="chev">›</span></button>`}
  return h+'</div><div class="foot"><button class="linkbtn" data-act="backup">Baixar backup dos dados (JSON)</button></div>';
}
function vTurma(t){
  const tops=topicosDe(t.id),als=alunosDe(t.id),s=statsTurma(t.id);
  let h=`<button class="back" data-act="voltar">‹ Todas as turmas</button>
  <div class="pagehead"><div><div class="eyebrow">Turma</div><h1>${esc(t.nome)}</h1></div>${ro?'':'<button class="btn sm" data-act="editar-turma">Editar turma</button>'}</div>
  <div class="card"><div class="bar ${s.meta&&s.falta<=0?'ok':''}"><i style="width:${pct(s.arrec,s.meta)}%"></i></div><div class="small num" style="margin-top:8px"><b>${brl(s.arrec)}</b> arrecadado de ${brl(s.meta)} · falta ${brl(s.falta)}</div></div>
  <section class="sec"><div class="sec-h"><h2>Tópicos</h2>${ro?'':'<button class="btn sm" data-act="novo-topico">+ Tópico</button>'}</div>`;
  if(!tops.length)h+=`<div class="empty"><span>Adicione os tópicos de pagamento desta turma, por exemplo <b>Sítio</b> ou <b>Formatura</b>, com o valor total que cada aluno precisa pagar.</span></div>`;
  else{h+='<div class="topics">';for(const tp of tops){const st=statsTop(tp);
    h+=`<button class="topic" data-act="editar-topico" data-id="${tp.id}"><b>${esc(tp.nome)}</b><span class="small muted num">Teto ${brl(tp.teto)} por aluno${tp.prazo?' · até '+fdata(tp.prazo):''}</span><div class="bar ${st.n&&st.falta<=0?'ok':''}"><i style="width:${pct(st.meta-st.falta,st.meta)}%"></i></div><span class="small num">${st.quit} de ${st.n} quitados</span></button>`}
    h+='</div>'}
  h+=`</section><section class="sec"><div class="sec-h"><h2>Alunos <span class="muted num">(${als.length})</span></h2>${ro?'':'<button class="btn sm" data-act="novo-aluno">+ Aluno</button>'}</div>`;
  if(!als.length)h+=`<div class="empty"><span>Nenhum aluno nesta turma ainda. Você pode colar uma lista de nomes, um por linha.</span></div>`;
  else h+=`<input class="search" id="busca" type="search" placeholder="Buscar aluno" value="${esc(ui.busca)}" autocomplete="off"><div class="list" id="alunos-list">${listaAlunos(t.id)}</div>`;
  return h+'</section>';
}
function listaAlunos(tid){
  const q=ui.busca.trim().toLowerCase();
  const als=alunosDe(tid).filter(a=>!q||(a.nome||'').toLowerCase().includes(q));
  if(!als.length)return '<div class="muted small">Nenhum aluno encontrado.</div>';
  return als.map(a=>{let falta=0;const pills=(a.topicos||[]).map(id=>{const tp=topico(id);if(!tp)return '';const p=pago(a.id,id),teto=Number(tp.teto)||0,f=Math.max(0,teto-p);falta+=f;
      return `<span class="pill ${f<=0.004?'ok':p>0?'warn':''} num">${esc(tp.nome)} ${f<=0.004?'✓ quitado':brl(p)+' / '+brl(teto)}</span>`}).join('');
    return `<button class="row" data-act="abrir-aluno" data-id="${a.id}"><div class="grow"><div class="name">${esc(a.nome)}</div><div class="pills">${pills||'<span class="pill">Sem tópicos</span>'}</div></div><div class="small num" style="text-align:right">${falta>0.004?`<span class="muted">falta</span><br><b>${brl(falta)}</b>`:'<span class="pos">Em dia</span>'}</div></button>`}).join('');
}

/* Saldo */
function vSaldo(){
  const f=ui.filtro,ft=ui.filtroTop;
  const pg=S.pagamentos.filter(p=>(!f||p.turmaId===f)&&(!ft||p.topicoId===ft));
  const dp=S.despesas.filter(d=>(!f||d.turmaId===f)&&(!ft||d.topicoId===ft)).sort((a,b)=>(b.data||'').localeCompare(a.data||'')||(b.atualizadoEm||0)-(a.atualizadoEm||0));
  const arrec=pg.reduce((s,p)=>s+(Number(p.valor)||0),0),gasto=dp.reduce((s,d)=>s+(Number(d.valor)||0),0);
  let h=`<div class="pagehead"><div><div class="eyebrow">Caixa</div><h1>Saldo</h1></div>${ro||!S.turmas.length?'':'<button class="btn primary" data-act="nova-despesa">+ Lançar despesa</button>'}</div>${filtroSelect(true)}
  <div class="saldo"><div><div class="lbl">Saldo disponível</div><div class="big num">${brl(arrec-gasto)}</div></div><div class="split"><div><span class="lbl">Arrecadado</span><span class="v num">${brl(arrec)}</span></div><div><span class="lbl">Despesas</span><span class="v num">− ${brl(gasto)}</span></div></div></div>`;
  if(!S.turmas.length)return h+`<div class="empty"><span>Cadastre uma turma e registre pagamentos para o saldo aparecer aqui.</span></div>`;
  if(dp.length){const cat={};dp.forEach(d=>cat[d.categoria||'Outros']=(cat[d.categoria||'Outros']||0)+(Number(d.valor)||0));
    const mx=Math.max(...Object.values(cat));
    h+=`<section class="sec"><h2>Gastos por categoria</h2><div class="card" style="display:flex;flex-direction:column;gap:10px">${Object.entries(cat).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><div class="bar"><i style="width:${Math.max(3,v/mx*100)}%"></i></div><span class="num">${brl(v)}</span></div>`).join('')}</div></section>`}
  h+=`<section class="sec"><h2>Despesas lançadas</h2>`;
  if(!dp.length)h+=`<div class="empty"><span>Nenhuma despesa ainda. Lance gastos como frete, enfeites ou aluguel do local e eles serão descontados do saldo.</span></div>`;
  else h+=`<div class="card">${dp.map(d=>{const t=turma(d.turmaId),tp=topico(d.topicoId);return `<div class="line-item"><div class="grow"><div>${esc(d.descricao||d.categoria)}</div><div class="small muted">${fdata(d.data)} · ${esc(d.categoria||'Outros')}${t&&!f?' · '+esc(t.nome):''}${tp?' · '+esc(tp.nome):''}</div></div><span class="neg num">− ${brl(d.valor)}</span>${ro?'':`<button class="x" data-act="del" data-col="despesas" data-id="${d.id}">Excluir</button>`}</div>`}).join('')}</div>`;
  return h+'</section>';
}

/* Estimativas */
function vEst(){
  const f=ui.filtro;
  const ts=S.turmas.filter(t=>!f||t.id===f);
  const tops=S.topicos.filter(t=>ts.some(x=>x.id===t.turmaId)).sort((a,b)=>(a.prazo||'9').localeCompare(b.prazo||'9'));
  let meta=0,arrec=0,falta=0;tops.forEach(t=>{const s=statsTop(t);meta+=s.meta;arrec+=s.arrec;falta+=s.falta});
  const als=S.alunos.filter(a=>ts.some(x=>x.id===a.turmaId)&&(a.topicos||[]).length);const q=als.filter(alunoQuitado).length;
  let h=`<div class="pagehead"><div><div class="eyebrow">Previsão</div><h1>Estimativas</h1></div></div>${filtroSelect(false)}`;
  if(!tops.length)return h+`<div class="empty"><span>As estimativas aparecem quando houver turmas com tópicos e alunos cadastrados.</span></div>`;
  h+=`<div class="tiles"><div class="tile"><span class="eyebrow">Meta total</span><span class="v num">${brl(meta)}</span></div><div class="tile"><span class="eyebrow">Arrecadado</span><span class="v ok num">${brl(arrec)}</span></div><div class="tile"><span class="eyebrow">Falta receber</span><span class="v warn num">${brl(falta)}</span></div><div class="tile"><span class="eyebrow">Alunos quitados</span><span class="v num">${q} de ${als.length}</span></div></div>`;
  h+='<section class="sec"><h2>Por tópico</h2>';
  for(const t of tops){const s=statsTop(t),tu=turma(t.turmaId),d=dias(t.prazo);
    const meses=d!==null&&d>0?Math.max(1,Math.ceil(d/30)):null;const pendN=s.pend.length;
    let hint='';
    if(!s.n)hint='Nenhum aluno inscrito neste tópico.';
    else if(!pendN)hint='Todos os alunos quitaram este tópico.';
    else if(meses){const porAluno=s.falta/pendN/meses;hint=`Para fechar até ${fdata(t.prazo)}, cada aluno pendente precisa pagar em média <b class="num">${brl(porAluno)}</b> por mês (${meses} ${meses===1?'mês':'meses'} restantes).`}
    else if(d!==null)hint=`O prazo passou com ${pendN} aluno${pendN===1?'':'s'} pendente${pendN===1?'':'s'}, faltando ${brl(s.falta)}.`;
    else hint=`Defina uma data limite para ver quanto cada aluno precisa pagar por mês.`;
    const open=!!ui.open[t.id];
    h+=`<div class="card est"><div class="est-h"><div><h3>${esc(t.nome)}</h3><div class="small muted">${esc(tu?tu.nome:'')} · teto ${brl(t.teto)} por aluno${t.prazo?' · limite '+fdata(t.prazo):''}</div></div>${prazoPill(t.prazo)}</div>
    <div class="bar ${s.n&&!pendN?'ok':''}"><i style="width:${pct(s.meta-s.falta,s.meta)}%"></i></div>
    <div class="trio num"><div><span class="eyebrow">Meta</span><span class="v">${brl(s.meta)}</span></div><div><span class="eyebrow">Arrecadado</span><span class="v pos">${brl(s.arrec)}</span></div><div><span class="eyebrow">Falta</span><span class="v">${brl(s.falta)}</span></div></div>
    <div class="pills"><span class="pill ok">${s.quit} quitado${s.quit===1?'':'s'}</span><span class="pill warn">${pendN-s.zero} pagando</span><span class="pill">${s.zero} sem pagamento</span></div>
    <div class="hint">${hint}</div>
    ${pendN?`<button class="linkbtn" data-act="toggle" data-id="${t.id}" aria-expanded="${open}">${open?'Ocultar':'Ver'} quem falta pagar (${pendN})</button>`:''}
    ${open&&pendN?`<div class="pend num">${s.pend.map(x=>`<div><span>${esc(x.a.nome)}</span><span><span class="muted">${brl(x.p)} pago ·</span> <b>falta ${brl(x.f)}</b></span></div>`).join('')}</div>`:''}
    </div>`}
  return h+'</section>';
}

/* ---------- sheets ---------- */
function openSheet(s){ui.sheet=s;renderSheet(true)}
function closeSheet(){ui.sheet=null;renderSheet(true)}
const VIEW_SHEETS=['aluno'];
function renderSheet(force){
  const root=$('#sheet-root');const s=ui.sheet;
  if(!s){root.innerHTML='';return}
  if(!force&&!VIEW_SHEETS.includes(s.type))return;
  const html=sheetHtml(s);if(html===null){ui.sheet=null;root.innerHTML='';return}
  const sc=root.querySelector('.sheet')?.scrollTop||0;
  root.innerHTML=`<div class="overlay" data-act="overlay"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  if(!force)root.querySelector('.sheet').scrollTop=sc;
  if(force){const fi=root.querySelector('[autofocus]');if(fi&&window.matchMedia('(min-width:700px)').matches)fi.focus()}
}
const head=(title,sub)=>`<div class="sheet-h"><div>${sub?`<div class="eyebrow">${sub}</div>`:''}<h3>${title}</h3></div><button class="close" data-act="close" aria-label="Fechar">✕</button></div>`;
function sheetHtml(s){
  if(s.type==='turma'){const t=s.id?turma(s.id):null;if(s.id&&!t)return null;
    return head(t?'Editar turma':'Nova turma')+`<form data-form="turma"><label class="f">Nome da turma<input id="i-nome" name="nome" required maxlength="80" placeholder="Ex.: 3º ano B — 2026" value="${esc(t?t.nome:'')}" autofocus></label><button class="btn primary block">${t?'Salvar':'Criar turma'}</button>${t?`<button type="button" class="btn danger block" data-act="del-turma" data-id="${t.id}">Excluir turma e todos os dados</button>`:''}</form>`}
  if(s.type==='topico'){const t=s.id?topico(s.id):null;if(s.id&&!t)return null;
    return head(t?'Editar tópico':'Novo tópico',esc(turma(ui.turma)?.nome||''))+`<form data-form="topico">
      <label class="f">Nome do tópico<input id="i-tnome" name="nome" required maxlength="60" placeholder="Ex.: Formatura" value="${esc(t?t.nome:'')}" autofocus></label>
      ${t?'':`<div class="quick">${['Sítio','Formatura','Viagem','Festa','Camiseta'].map(n=>`<button type="button" data-act="quick" data-v="${n}">${n}</button>`).join('')}</div>`}
      <div class="two"><label class="f">Valor total por aluno<input id="i-teto" name="teto" required inputmode="decimal" placeholder="350,00" value="${t?String(t.teto).replace('.',','):''}"></label>
      <label class="f">Data limite<input id="i-prazo" name="prazo" type="date" value="${esc(t?t.prazo||'':'')}"></label></div>
      <p class="small muted" style="margin:0">Cada aluno paga o valor que puder por mês até completar o total.</p>
      ${t?'':`<label class="check"><input type="checkbox" id="i-todos" name="todos" checked>Incluir todos os alunos atuais da turma</label>`}
      <button class="btn primary block">${t?'Salvar':'Adicionar tópico'}</button>
      ${t?`<button type="button" class="btn danger block" data-act="del-topico" data-id="${t.id}">Excluir tópico e seus pagamentos</button>`:''}</form>`}
  if(s.type==='alunoForm'){const a=s.id?aluno(s.id):null;if(s.id&&!a)return null;const tid=a?a.turmaId:ui.turma;const tops=topicosDe(tid);
    return head(a?'Editar aluno':'Novo aluno',esc(turma(tid)?.nome||''))+`<form data-form="aluno">
      ${a?`<label class="f">Nome<input id="i-anome" name="nome" required maxlength="100" value="${esc(a.nome)}"></label>
      <label class="f">Contato do responsável (opcional)<input id="i-contato" name="contato" maxlength="100" value="${esc(a.contato||'')}"></label>`
      :`<label class="f">Nome do aluno<textarea id="i-anomes" name="nomes" required placeholder="Um nome por linha para cadastrar vários de uma vez" autofocus></textarea></label>`}
      ${tops.length?`<div class="sec"><span class="eyebrow">Participa de</span><div class="checks">${tops.map(t=>`<label class="check"><input type="checkbox" name="top" value="${t.id}" ${!a||(a.topicos||[]).includes(t.id)?'checked':''}>${esc(t.nome)} <span class="muted small num">· ${brl(t.teto)}</span></label>`).join('')}</div></div>`:'<p class="small muted" style="margin:0">Esta turma ainda não tem tópicos. Depois de criá-los, você pode incluir os alunos.</p>'}
      <button class="btn primary block">${a?'Salvar':'Cadastrar'}</button>
      ${a?`<button type="button" class="btn danger block" data-act="del-aluno" data-id="${a.id}">Excluir aluno e seus pagamentos</button>`:''}</form>`}
  if(s.type==='aluno'){const a=aluno(s.id);if(!a)return null;
    const tops=(a.topicos||[]).map(topico).filter(Boolean);
    const pgs=S.pagamentos.filter(p=>p.alunoId===a.id).sort((x,y)=>(y.data||'').localeCompare(x.data||'')||(y.atualizadoEm||0)-(x.atualizadoEm||0));
    let h=head(esc(a.nome),esc(turma(a.turmaId)?.nome||''));
    if(a.contato)h+=`<div class="small muted">Contato: ${esc(a.contato)}</div>`;
    if(!tops.length)h+=`<div class="empty"><span>Este aluno não participa de nenhum tópico.</span></div>`;
    for(const t of tops){const p=pago(a.id,t.id),teto=Number(t.teto)||0,f=Math.max(0,teto-p);
      h+=`<div class="card est"><div class="est-h"><b style="font-family:var(--f-display);font-size:1.05rem">${esc(t.nome)}</b>${f<=0.004?'<span class="pill ok">Quitado</span>':prazoPill(t.prazo)}</div><div class="bar ${f<=0.004?'ok':''}"><i style="width:${pct(p,teto)}%"></i></div><div class="small num">Pago <b>${brl(p)}</b> de ${brl(teto)}${f>0.004?` · falta <b>${brl(f)}</b>`:''}</div>${ro||f<=0.004?'':`<button class="btn primary" data-act="pagar" data-topico="${t.id}">Registrar pagamento</button>`}</div>`}
    h+=`<div class="sec"><h2>Histórico</h2>`;
    if(!pgs.length)h+='<div class="small muted">Nenhum pagamento registrado.</div>';
    else h+=`<div class="card">${pgs.map(p=>`<div class="line-item"><div class="grow"><div>${esc(topico(p.topicoId)?.nome||'Tópico removido')}</div><div class="small muted">${fdata(p.data)}${p.forma?' · '+esc(p.forma):''}${p.obs?' · '+esc(p.obs):''}</div></div><span class="pos num">${brl(p.valor)}</span>${ro?'':`<button class="x" data-act="del" data-col="pagamentos" data-id="${p.id}">Excluir</button>`}</div>`).join('')}</div>`;
    h+='</div>';
    if(!ro)h+=`<button class="btn block" data-act="editar-aluno" data-id="${a.id}">Editar aluno</button>`;
    return h}
  if(s.type==='pagar'){const a=aluno(s.aluno);if(!a)return null;const tops=(a.topicos||[]).map(topico).filter(Boolean);
    const cur=s.topico||tops[0]?.id;const fal=cur?Math.max(0,(Number(topico(cur)?.teto)||0)-pago(a.id,cur)):0;
    return head('Registrar pagamento',esc(a.nome))+`<form data-form="pagar">
      <label class="f">Tópico<select id="i-ptop" name="topico">${tops.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.nome)} — falta ${brl(Math.max(0,(Number(t.teto)||0)-pago(a.id,t.id)))}</option>`).join('')}</select></label>
      <div class="two"><label class="f">Valor<input id="i-pval" name="valor" required inputmode="decimal" placeholder="${fal?String(fal.toFixed(2)).replace('.',','):'0,00'}" autofocus></label>
      <label class="f">Data<input id="i-pdata" name="data" type="date" value="${hoje()}" required></label></div>
      <label class="f">Forma de pagamento<select id="i-pforma" name="forma">${FORMAS.map(x=>`<option>${x}</option>`).join('')}</select></label>
      <label class="f">Observação (opcional)<input id="i-pobs" name="obs" maxlength="120" placeholder="Ex.: parcela de outubro"></label>
      <button class="btn primary block">Salvar pagamento</button>
      <button type="button" class="btn block" data-act="abrir-aluno" data-id="${a.id}">Voltar</button></form>`}
  if(s.type==='despesa'){
    const tid=ui.filtro||S.turmas.slice().sort(byNome)[0]?.id||'';
    return head('Lançar despesa')+`<form data-form="despesa">
      <label class="f">Descrição<input id="i-ddesc" name="descricao" required maxlength="120" placeholder="Ex.: Frete dos enfeites" autofocus></label>
      <div class="two"><label class="f">Categoria<select id="i-dcat" name="categoria">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="f">Valor<input id="i-dval" name="valor" required inputmode="decimal" placeholder="0,00"></label></div>
      <div class="two"><label class="f">Turma<select id="i-dturma" name="turma" data-act-change="dturma">${S.turmas.slice().sort(byNome).map(t=>`<option value="${t.id}" ${t.id===tid?'selected':''}>${esc(t.nome)}</option>`).join('')}</select></label>
      <label class="f">Tópico<select id="i-dtop" name="topico">${dtopOpts(tid)}</select></label></div>
      <label class="f">Data<input id="i-ddata" name="data" type="date" value="${hoje()}" required></label>
      <button class="btn primary block">Lançar despesa</button></form>`}
  return null;
}
function dtopOpts(tid){return `<option value="">Geral da turma</option>`+topicosDe(tid).map(t=>`<option value="${t.id}" ${t.id===ui.filtroTop?'selected':''}>${esc(t.nome)}</option>`).join('')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  if(act==='overlay'){if(e.target===el)closeSheet();return}
  switch(act){
    case 'tab':ui.tab=el.dataset.tab;if(ui.tab==='turmas'&&ui.turma&&e.detail)ui.turma=ui.turma;saveUi();render();scrollTo(0,0);break;
    case 'close':closeSheet();break;
    case 'entrar':entrar();break;
    case 'sair':signOut(auth);break;
    case 'backup':backup();break;
    case 'nova-turma':openSheet({type:'turma'});break;
    case 'editar-turma':openSheet({type:'turma',id:ui.turma});break;
    case 'abrir-turma':ui.turma=id;ui.busca='';render();scrollTo(0,0);break;
    case 'voltar':ui.turma=null;render();break;
    case 'novo-topico':openSheet({type:'topico'});break;
    case 'editar-topico':if(!ro)openSheet({type:'topico',id});break;
    case 'novo-aluno':openSheet({type:'alunoForm'});break;
    case 'editar-aluno':openSheet({type:'alunoForm',id});break;
    case 'abrir-aluno':openSheet({type:'aluno',id});break;
    case 'pagar':openSheet({type:'pagar',aluno:ui.sheet.id,topico:el.dataset.topico});break;
    case 'nova-despesa':openSheet({type:'despesa'});break;
    case 'quick':{const i=$('#i-tnome');i.value=el.dataset.v;$('#i-teto').focus();break}
    case 'toggle':ui.open[id]=!ui.open[id];render();break;
    case 'del':if(arm(el))run(()=>del(el.dataset.col,id),'Excluído');break;
    case 'del-turma':if(arm(el,'Toque de novo para apagar tudo'))run(async()=>{
      for(const c of ['pagamentos','despesas','alunos','topicos'])for(const x of S[c].filter(x=>x.turmaId===id))await del(c,x.id);
      await del('turmas',id);ui.turma=null;closeSheet()},'Turma excluída');break;
    case 'del-topico':if(arm(el,'Toque de novo para confirmar'))run(async()=>{
      for(const p of S.pagamentos.filter(p=>p.topicoId===id))await del('pagamentos',p.id);
      for(const a of S.alunos.filter(a=>(a.topicos||[]).includes(id)))await put('alunos',a.id,{...a,topicos:a.topicos.filter(x=>x!==id)});
      await del('topicos',id);closeSheet()},'Tópico excluído');break;
    case 'del-aluno':if(arm(el,'Toque de novo para confirmar'))run(async()=>{
      for(const p of S.pagamentos.filter(p=>p.alunoId===id))await del('pagamentos',p.id);
      await del('alunos',id);closeSheet()},'Aluno excluído');break;
  }
});
function arm(el,msg){
  if(el.dataset.armed){return true}
  el.dataset.armed='1';const old=el.textContent;el.textContent=msg||'Confirmar';el.classList.add('armed');
  setTimeout(()=>{if(el.isConnected){delete el.dataset.armed;el.textContent=old;el.classList.remove('armed')}},3500);
  return false;
}
document.addEventListener('input',e=>{
  if(e.target.id==='busca'){ui.busca=e.target.value;const l=$('#alunos-list');if(l)l.innerHTML=listaAlunos(ui.turma)}
});
document.addEventListener('change',e=>{
  if(e.target.id==='f-turma'){ui.filtro=e.target.value;ui.filtroTop='';saveUi();render()}
  else if(e.target.id==='f-top'){ui.filtroTop=e.target.value;render()}
  else if(e.target.id==='i-dturma'){$('#i-dtop').innerHTML=dtopOpts(e.target.value)}
  else if(e.target.id==='i-ptop'){const a=aluno(ui.sheet.aluno);const f=Math.max(0,(Number(topico(e.target.value)?.teto)||0)-pago(a.id,e.target.value));$('#i-pval').placeholder=f.toFixed(2).replace('.',',');ui.sheet.topico=e.target.value}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.sheet)closeSheet()});

document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,k=f.dataset.form,fd=new FormData(f),s=ui.sheet;
  const btn=f.querySelector('button.primary');if(btn)btn.disabled=true;
  const done=()=>{if(btn)btn.disabled=false};
  if(k==='turma'){const nome=String(fd.get('nome')).trim();if(!nome)return done();
    if(s.id){const t=turma(s.id);run(()=>put('turmas',t.id,{...t,nome}).then(closeSheet),'Turma salva').finally(done)}
    else{const id=uid();run(()=>put('turmas',id,{nome,criadoEm:Date.now()}).then(()=>{closeSheet();ui.turma=id;ui.tab='turmas';render()}),'Turma criada').finally(done)}}
  else if(k==='topico'){const nome=String(fd.get('nome')).trim(),teto=parseBRL(fd.get('teto')),prazo=String(fd.get('prazo')||'');
    if(!nome||!(teto>0)){toast('Informe o nome e um valor maior que zero.');return done()}
    if(s.id){const t=topico(s.id);run(()=>put('topicos',t.id,{...t,nome,teto,prazo}).then(closeSheet),'Tópico salvo').finally(done)}
    else{const id=uid(),todos=fd.get('todos');run(async()=>{await put('topicos',id,{turmaId:ui.turma,nome,teto,prazo,criadoEm:Date.now()});
      if(todos)for(const a of alunosDe(ui.turma))await put('alunos',a.id,{...a,topicos:[...(a.topicos||[]),id]});closeSheet()},'Tópico adicionado').finally(done)}}
  else if(k==='aluno'){const tops=fd.getAll('top');
    if(s.id){const a=aluno(s.id);const nome=String(fd.get('nome')).trim();if(!nome)return done();
      run(()=>put('alunos',a.id,{...a,nome,contato:String(fd.get('contato')||'').trim(),topicos:tops}).then(()=>openSheet({type:'aluno',id:a.id})),'Aluno salvo').finally(done)}
    else{const nomes=String(fd.get('nomes')).split(/\n/).map(x=>x.trim()).filter(Boolean);if(!nomes.length)return done();
      run(async()=>{for(const nome of nomes)await put('alunos',uid(),{turmaId:ui.turma,nome,contato:'',topicos:tops,criadoEm:Date.now()});closeSheet()},nomes.length>1?nomes.length+' alunos cadastrados':'Aluno cadastrado').finally(done)}}
  else if(k==='pagar'){const valor=parseBRL(fd.get('valor')),top=String(fd.get('topico'));
    if(!(valor>0)){toast('Informe um valor maior que zero.');return done()}
    const a=aluno(s.aluno);
    run(()=>put('pagamentos',uid(),{alunoId:a.id,turmaId:a.turmaId,topicoId:top,valor,data:String(fd.get('data')),forma:String(fd.get('forma')||''),obs:String(fd.get('obs')||'').trim()}).then(()=>openSheet({type:'aluno',id:a.id})),'Pagamento de '+brl(valor)+' registrado').finally(done)}
  else if(k==='despesa'){const valor=parseBRL(fd.get('valor'));
    if(!(valor>0)){toast('Informe um valor maior que zero.');return done()}
    run(()=>put('despesas',uid(),{descricao:String(fd.get('descricao')).trim(),categoria:String(fd.get('categoria')),valor,turmaId:String(fd.get('turma')),topicoId:String(fd.get('topico')||''),data:String(fd.get('data'))}).then(closeSheet),'Despesa lançada').finally(done)}
});

/* ---------- boot ---------- */
async function entrar(){
  const prov=new GoogleAuthProvider();prov.setCustomParameters({prompt:'select_account'});
  try{await signInWithPopup(auth,prov)}
  catch(e){
    if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment')await signInWithRedirect(auth,prov);
    else if(e.code==='auth/unauthorized-domain')toast('Domínio não autorizado no Firebase. Veja o README.');
    else if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request')toast('Não foi possível entrar: '+e.code);
  }
}
window.addEventListener('online',scheduleRender);
window.addEventListener('offline',scheduleRender);

render();
if(!firebaseConfig||!firebaseConfig.apiKey||String(firebaseConfig.apiKey).startsWith('COLE')){mode='config';render()}
else{
  const app=initializeApp(firebaseConfig);
  auth=getAuth(app);
  fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
  getRedirectResult(auth).catch(()=>{});
  onAuthStateChanged(auth,u=>{
    me=u;erroAcesso=false;
    unsubs.forEach(x=>x());unsubs=[];
    if(!u){COLS.forEach(c=>S[c]=[]);ui.sheet=null;mode='login';render();return}
    mode='loading';render();assinar();
  });
}
})();
</script>
</body>
</html>
